version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      # Every action in one pull request, majors included.
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    groups:
      # AndroidX / Compose / Kotlin move together: one pull request per month.
      gradle:
        patterns: ["*"]
    commit-message:
      prefix: chore

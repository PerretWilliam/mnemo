name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Steps to reproduce, then expected vs actual behaviour.
      placeholder: |
        1. Open a deck
        2. ...
        Expected: ...
        Actual: ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown at the bottom of Settings.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and OS
      placeholder: Pixel 8, Android 16
  - type: textarea
    id: extra
    attributes:
      label: Extra context
      description: Screenshots, or the JSON that fails to import (remove private content).
